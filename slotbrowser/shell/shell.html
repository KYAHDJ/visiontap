<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VisionTap Slots</title>
<link rel="stylesheet" href="shell.css" />
</head>
<body>
<div id="toolbar">
  <div class="drag-zone">
    <div class="brand"><span class="logo-dot"></span> VisionTap Slots</div>
  </div>
  <div class="controls">
    <div class="mode-toggle" id="modeToggle" title="Switch between Color and Math tasks">
      <button class="mode-btn active" data-mode="color">Color</button>
      <button class="mode-btn" data-mode="math">Math</button>
    </div>
    <button id="restartBtn" class="btn ctrl" title="Restart all slots">&#8635;</button>
    <button id="stopBtn" class="btn ctrl danger" title="Stop all">&#9632;</button>
    <button id="startBtn" class="btn ctrl primary" title="Start all">&#9654;</button>
    <label class="toggle" title="Pause all slots when this window is minimized">
      <input type="checkbox" id="pauseToggle" />
      <span>Pause when hidden</span>
    </label>
    <button id="addBtn" class="btn primary">+ Add slot</button>
    <button id="gearBtn" class="btn icon" title="Settings">&#9881;</button>
    <span class="sep"></span>
    <button id="minBtn" class="btn icon" title="Minimize">&#8211;</button>
    <button id="closeBtn" class="btn icon danger" title="Close">&#10005;</button>
  </div>
</div>

<div id="settingsDrawer" class="drawer hidden">
  <div class="page-head">
    <span class="page-title">VisionTap Slots &#183; Settings</span>
    <button id="closeSettings" class="x-small" title="Close">&#10005;</button>
  </div>

  <div class="scr">
  <div class="grp">
    <div class="grp-title">Window &amp; layout</div>
    <div class="row">
      <label>Width <input type="number" id="setW" min="700" step="10" /></label>
      <label>Height <input type="number" id="setH" min="500" step="10" /></label>
      <label>Grid columns
        <select id="setGrid">
          <option value="0">Auto (fit phone panels)</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
    </div>
    <div class="row">
      <label>Default zoom
        <select id="setZoom">
          <option value="75">75%</option>
          <option value="90">90%</option>
          <option value="100">100%</option>
          <option value="125">125%</option>
          <option value="150">150%</option>
        </select>
      </label>
      <label>OCR speed
        <select id="setDelay">
          <option value="1">Fast (1x)</option>
          <option value="1.5">Balanced (1.5x)</option>
          <option value="2">Economy (2x)</option>
          <option value="3">Battery saver (3x)</option>
        </select>
      </label>
      <label class="toggle">
        <input type="checkbox" id="setPauseHidden" /> Pause when hidden
      </label>
      <label class="toggle">
        <input type="checkbox" id="setAdBlock" /> Block ads on site (may flag the account)
      </label>
    </div>
    <div class="row">
      <label class="toggle">
        <input type="checkbox" id="setLowRam" /> Low-RAM mode (no GPU; needs restart)
      </label>
    </div>
    <div class="row">
      <label class="toggle">
        <input type="checkbox" id="setAutoStart" /> Launch at Windows login
      </label>
    </div>
    <div class="row">
      <button id="desktopShortcutBtn" class="small-link">+ Create desktop shortcut</button>
    </div>
  </div>

  <div class="grp">
    <div class="grp-title">Slots <button id="addSlotBtn" class="small-link" title="Add another account/slot">+ Add account</button></div>
    <div id="slotForms"></div>
  </div>

  <div class="drawer-actions">
    <button id="saveSettings" class="btn primary">Apply</button>
  </div>
  </div>
</div>

<datalist id="savedUsers"></datalist>
<datalist id="savedAccountNames"></datalist>

<div id="slotChrome">
  <div class="chips" id="chips"></div>
</div>

<div id="empty">
  <div class="big">+</div>
  <p>No slots yet. Add a slot to start solving.</p>
</div>

<script src="shell.js"></script>
</body>
</html>
